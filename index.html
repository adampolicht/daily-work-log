<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Work Log</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <!-- ── Calendar / dashboard ─────────────────────────────────────────────── -->
  <section id="view-calendar" class="view">
    <div class="toolbar">
      <span class="drag-region"></span>
      <button id="cal-prev" class="cal-nav" title="Previous month">‹</button>
      <span id="cal-title" class="cal-title"></span>
      <button id="cal-next" class="cal-nav" title="Next month">›</button>
      <span class="spacer"></span>
      <button id="cal-folder" title="Open WorkLog folder">📂</button>
    </div>

    <div class="cal-weekdays">
      <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span>
      <span>Fri</span><span>Sat</span><span>Sun</span>
    </div>

    <div id="cal-grid" class="cal-grid"></div>

    <div class="footer">
      <span></span>
      <button id="cal-close">Close</button>
    </div>
  </section>

  <!-- ── Single-day note ──────────────────────────────────────────────────── -->
  <section id="view-note" class="view hidden">
    <div class="toolbar">
      <span class="drag-region"></span>
      <button id="btn-back" title="Back to calendar">‹ Calendar</button>
      <span id="date-label"></span>
      <span class="spacer"></span>
      <button id="btn-folder" title="Open WorkLog folder">📂</button>
      <button id="btn-toggle-sidebar" title="Toggle activity">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <rect x="1" y="1" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.2"/>
          <line x1="9.5" y1="1.5" x2="9.5" y2="12.5" stroke="currentColor" stroke-width="1.2"/>
        </svg>
      </button>
    </div>

    <div class="main">
      <textarea
        id="note"
        placeholder="What did you do today?"
        spellcheck="true"
      ></textarea>

      <aside class="activity-panel" id="activity-panel">
        <div class="activity-header">Today's activity</div>
        <div id="activity-content" class="activity-loading">Loading…</div>
      </aside>
    </div>

    <div class="footer">
      <span id="save-status"></span>
      <button id="btn-save">Save</button>
    </div>
  </section>

  <script src="calendar.js"></script>
  <script src="app.js"></script>
</body>
</html>
